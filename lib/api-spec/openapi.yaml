openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: leaderboard
    description: Investigator leaderboard operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /leaderboard:
    get:
      operationId: getInvestigatorLeaderboard
      tags: [leaderboard]
      summary: Get the top investigator scores
      responses:
        "200":
          description: Shared top investigator scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigatorLeaderboard"
    post:
      operationId: submitInvestigatorScore
      tags: [leaderboard]
      summary: Submit a completed case score
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InvestigatorScoreInput"
      responses:
        "200":
          description: Updated shared top investigator scores
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvestigatorLeaderboard"
        "400":
          description: Invalid score data
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    InvestigatorScore:
      type: object
      properties:
        playerName:
          type: string
        score:
          type: integer
        elapsedSeconds:
          type: integer
        correctAnswers:
          type: integer
      required:
        - playerName
        - score
        - elapsedSeconds
        - correctAnswers
    InvestigatorLeaderboard:
      type: array
      items:
        $ref: "#/components/schemas/InvestigatorScore"
    InvestigatorScoreInput:
      type: object
      additionalProperties: false
      properties:
        attemptId:
          type: string
          format: uuid
        playerName:
          type: string
          minLength: 1
          maxLength: 24
        score:
          type: integer
          minimum: 100
          maximum: 1200
        elapsedSeconds:
          type: integer
          minimum: 0
          maximum: 86400
        correctAnswers:
          type: integer
          minimum: 1
          maximum: 8
      required:
        - attemptId
        - playerName
        - score
        - elapsedSeconds
        - correctAnswers
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

